name: Server Identity CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  identity-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: panda_auth_ci_password
          POSTGRES_DB: panda_auth_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d panda_auth_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout Server
        uses: actions/checkout@v4
        with:
          path: panda-auth-server
      - name: Checkout Share
        uses: actions/checkout@v4
        with:
          repository: PandaLabs2026/panda-auth-share
          path: panda-auth-share
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        working-directory: panda-auth-server
        run: dotnet restore PandaAuth.Server.slnx --nologo -m:1
      - name: Build
        working-directory: panda-auth-server
        run: dotnet build PandaAuth.Server.slnx --nologo -m:1 --no-restore
      - name: Identity and security focused tests
        working-directory: panda-auth-server
        env:
          PANDA_AUTH_TEST_POSTGRES: Host=localhost;Port=5432;Database=panda_auth_ci;Username=postgres;Password=panda_auth_ci_password
        run: >-
          dotnet test tests/PandaAuth.Tests/PandaAuth.Tests.csproj
          --nologo -m:1 --no-restore
          --filter
          'FullyQualifiedName~MfaService|FullyQualifiedName~MfaController|FullyQualifiedName~WebAuthnCeremony|FullyQualifiedName~SessionSecurity|FullyQualifiedName~ClaimsPolicy|FullyQualifiedName~ExternalIdentity|FullyQualifiedName~AuthorizationTokenClaims|FullyQualifiedName~LoginRateLimiter|FullyQualifiedName~SigningKeyOptions|FullyQualifiedName~UserStoreMigration|FullyQualifiedName~RefreshTokenPolicy|FullyQualifiedName~RefreshTokenReplayProtocol'
